<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Voice Timing</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27%23F12B19%27/%3E%3Cpath d=%27M7 13v6M12 9v14M16 6v20M20 10v12M25 13v6%27 stroke=%27white%27 stroke-width=%272.6%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#F12B19;--od:#C31F10;--tint:#FFF3F1;--tint2:#FFE3DF;--line:#FFD2CC;--w:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--w);color:var(--od)}
body{font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
  background:radial-gradient(900px 420px at 50% -120px,var(--tint2),transparent 70%),var(--w)}
.wrap{max-width:640px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 20px 60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--o);font-size:1.05rem}
.logo{width:36px;height:36px;border-radius:11px;background:var(--o);display:grid;place-items:center;box-shadow:0 6px 16px rgba(241,43,25,.28)}
.logo svg{width:20px;height:20px;stroke:#fff}
h1{font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.1;letter-spacing:-.035em;color:var(--o);margin:34px 0 10px;font-weight:800}
.sub{margin:0 0 26px;font-size:1.05rem;color:var(--od)}
.hide{display:none!important}

/* options */
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chips{display:flex;background:var(--tint);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.chips label{position:relative;cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:block;padding:8px 16px;border-radius:999px;font-weight:600;font-size:.92rem;transition:all .2s}
.chips input:checked+span{background:var(--o);color:#fff;box-shadow:0 3px 10px rgba(241,43,25,.3)}
.chips input:focus-visible+span{outline:2px solid var(--o);outline-offset:2px}

/* upload */
.drop{display:block;border:2px dashed var(--o);background:var(--tint);border-radius:26px;padding:44px 20px;text-align:center;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
.drop:hover,.drop.over{background:var(--tint2);transform:translateY(-2px);box-shadow:0 14px 34px rgba(241,43,25,.15)}
.drop:focus-within{outline:3px solid var(--o);outline-offset:3px}
.pill{width:68px;height:68px;border-radius:50%;background:var(--o);display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 10px 24px rgba(241,43,25,.35)}
.pill svg{width:30px;height:30px;stroke:#fff}
.drop b{display:block;font-size:1.2rem;color:var(--o);font-weight:800}
.drop small{color:var(--od);opacity:.8}
.drop input{position:absolute;width:1px;height:1px;opacity:0}

/* progress */
.card{background:var(--w);border:1.5px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(241,43,25,.08)}
.steps{display:flex;gap:8px;margin-bottom:16px}
.st{flex:1;font-size:.8rem;font-weight:700;text-align:center;padding:7px 4px;border-radius:999px;background:var(--tint);color:var(--od);opacity:.55;transition:all .3s}
.st.on{background:var(--o);color:#fff;opacity:1}
.st.done{background:var(--tint2);opacity:1}
.bar{height:10px;border-radius:999px;background:var(--tint2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--o);transition:width .4s ease}
.bar.ind i{width:38%;animation:sl 1.3s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(270%)}}
#msg{margin:12px 0 0;font-weight:600}
.err{background:var(--tint);border:1.5px solid var(--o);border-radius:16px;padding:14px 16px;font-weight:600;margin-top:14px}

/* result */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 20px;background:var(--o);color:#fff;cursor:pointer;transition:transform .15s,box-shadow .2s;box-shadow:0 8px 20px rgba(241,43,25,.28)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.line{background:var(--w);color:var(--o);border:1.5px solid var(--o);box-shadow:none}
.btn:focus-visible{outline:3px solid var(--od);outline-offset:2px}
.btns{display:flex;gap:10px;margin-top:16px}
.btns .btn{flex:1}
video{width:100%;max-height:240px;border-radius:16px;background:var(--tint);margin-bottom:14px}
.list{max-height:52vh;overflow:auto;border:1.5px solid var(--line);border-radius:18px;background:var(--w)}
.ln{display:flex;gap:14px;padding:12px 16px;border-bottom:1px solid var(--tint2);cursor:pointer;transition:background .15s}
.ln:last-child{border:0}
.ln:hover{background:var(--tint)}
.ln.cur{background:var(--tint2)}
.t{flex:none;width:92px;color:var(--o);font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums;padding-top:2px}
.plain{padding:16px;white-space:pre-wrap}
.note{font-size:.85rem;margin:10px 2px 0;opacity:.85}
.link{background:none;border:0;color:var(--o);font:inherit;font-weight:700;cursor:pointer;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></div>Voice Timing</div>

  <!-- STEP 1: choose -->
  <section id="pick">
    <h1>Voice to text,<br>in one tap.</h1>
    <p class="sub">Upload audio or video. Get the transcript instantly.</p>
    <div class="opts">
      <div class="chips" role="radiogroup" aria-label="Language">
        <label><input type="radio" name="lang" value="" checked><span>Auto</span></label>
        <label><input type="radio" name="lang" value="bn"><span>Bengali</span></label>
        <label><input type="radio" name="lang" value="en"><span>English</span></label>
      </div>
    </div>
    <label class="drop" id="drop">
      <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></div>
      <b>Tap to upload</b>
      <small>Audio or video from your phone</small>
      <input id="f" type="file" accept="audio/*,video/*">
    </label>
    <details style="margin-top:14px">
      <summary class="link" style="list-style:none;cursor:pointer">More options</summary>
      <div class="opts" style="margin-top:10px">
        <div class="chips" role="radiogroup" aria-label="Accuracy">
          <label><input type="radio" name="mdl" value="whisper-large-v3-turbo" checked><span>Fast</span></label>
          <label><input type="radio" name="mdl" value="whisper-large-v3"><span>Best accuracy</span></label>
        </div>
      </div>
    </details>
    <div id="err0" class="err hide"></div>
  </section>

  <!-- STEP 2: working -->
  <section id="work" class="hide" style="margin-top:34px">
    <div class="card">
      <div class="steps"><div class="st" id="s1">1 Prepare</div><div class="st" id="s2">2 Transcribe</div><div class="st" id="s3">3 Done</div></div>
      <div class="bar ind" id="bar"><i id="pb"></i></div>
      <p id="msg">Preparing your file…</p>
    </div>
    <div id="err1" class="err hide"></div>
    <div style="margin-top:14px"><button class="link hide" id="retry">Choose another file</button></div>
  </section>

  <!-- STEP 3: result -->
  <section id="out" class="hide" style="margin-top:30px">
    <video id="pl" controls playsinline></video>
    <div class="top">
      <div class="chips" role="radiogroup" aria-label="Output">
        <label><input type="radio" name="mode" value="time" checked><span>With timestamps</span></label>
        <label><input type="radio" name="mode" value="text"><span>Text only</span></label>
      </div>
    </div>
    <div class="list" id="list"></div>
    <p class="note" id="note"></p>
    <div class="btns"><button class="btn" id="cp">Copy</button><button class="btn line" id="dl">Download</button></div>
    <div style="margin-top:18px;text-align:center"><button class="link" id="again">Transcribe another file</button></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const val = n => document.querySelector(`input[name=${n}]:checked`).value;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const fmt = s => { const m = Math.floor(s / 60); return String(m).padStart(2, "0") + ":" + (s - m * 60).toFixed(1).padStart(4, "0"); };
const srtT = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + (s % 60).toFixed(3).padStart(6, "0").replace(".", ","); };
let lines = [], words = [], running = false;

/* ---------- screens ---------- */
function show(id) { ["pick", "work", "out"].forEach(x => $(x).classList.toggle("hide", x !== id)); window.scrollTo({ top: 0, behavior: "smooth" }); }
function step(n, text, pct) {
  [1, 2, 3].forEach(i => $("s" + i).className = "st" + (i < n ? " done" : i === n ? " on" : ""));
  $("msg").textContent = text;
  const ind = pct == null; $("bar").classList.toggle("ind", ind);
  if (!ind) $("pb").style.width = pct + "%";
}
function fail(text) {
  $("bar").classList.remove("ind"); $("err1").textContent = text; $("err1").classList.remove("hide"); $("retry").classList.remove("hide");
  running = false;
}
$("retry").onclick = $("again").onclick = () => { $("f").value = ""; $("err1").classList.add("hide"); $("retry").classList.add("hide"); show("pick"); };

/* ---------- upload ---------- */
$("f").onchange = e => e.target.files[0] && run(e.target.files[0]);
["dragover", "dragenter"].forEach(v => $("drop").addEventListener(v, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach(v => $("drop").addEventListener(v, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", e => e.dataTransfer.files[0] && run(e.dataTransfer.files[0]));

/* ---------- audio extraction (audio or video → 16 kHz mono) ---------- */
async function to16k(buf) {
  if (buf.sampleRate === 16000 && buf.numberOfChannels === 1) return buf.getChannelData(0);
  const oc = new OfflineAudioContext(1, Math.max(1, Math.ceil(buf.duration * 16000)), 16000);
  const s = oc.createBufferSource(); s.buffer = buf; s.connect(oc.destination); s.start();
  return (await oc.startRendering()).getChannelData(0);
}
function capture(file, note) { // fallback: play silently and record
  return new Promise((res, rej) => {
    const AC = window.AudioContext || window.webkitAudioContext, ctx = new AC();
    const v = document.createElement("video"); v.playsInline = true; v.preload = "auto"; v.src = URL.createObjectURL(file);
    const ch = []; v.onerror = () => rej(new Error("unsupported"));
    v.onloadedmetadata = async () => {
      try {
        const src = ctx.createMediaElementSource(v), sp = ctx.createScriptProcessor(4096, 1, 1), mute = ctx.createGain();
        mute.gain.value = 0; src.connect(sp); sp.connect(mute); mute.connect(ctx.destination);
        sp.onaudioprocess = e => { ch.push(new Float32Array(e.inputBuffer.getChannelData(0))); note(v.currentTime / v.duration); };
        v.onended = async () => {
          try {
            const n = ch.reduce((a, c) => a + c.length, 0), all = new Float32Array(n); let o = 0;
            ch.forEach(c => { all.set(c, o); o += c.length; });
            let pk = 0; for (let i = 0; i < n; i += 50) pk = Math.max(pk, Math.abs(all[i]));
            if (pk < 1e-4) return rej(new Error("silent"));
            const b = ctx.createBuffer(1, n, ctx.sampleRate); b.copyToChannel(all, 0); ctx.close(); res(await to16k(b));
          } catch (e) { rej(e); }
        };
        await ctx.resume(); await v.play();
      } catch (e) { rej(e); }
    };
  });
}
async function getPcm(file) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext, ctx = new AC({ sampleRate: 16000 });
    const data = await file.arrayBuffer();
    const dec = await new Promise((ok, no) => { const r = ctx.decodeAudioData(data, ok, no); if (r && r.catch) r.catch(no); });
    ctx.close(); return await to16k(dec);
  } catch (e) {
    step(1, "Reading the sound from your video. Keep this screen open…", 0);
    return await capture(file, p => step(1, "Reading the sound… " + Math.round(p * 100) + "%", p * 100));
  }
}

/* ---------- chunking + WAV ---------- */
function split(pcm) { // ~100 s pieces, cut at the quietest moment so words are not sliced
  const SR = 16000, MAX = 100 * SR, W = 800, out = []; let s = 0;
  while (pcm.length - s > MAX + 10 * SR) {
    let best = s + MAX, min = 1e9;
    for (let p = s + MAX - 8 * SR; p < s + MAX; p += W) { let e = 0; for (let i = p; i < p + W; i += 4) e += Math.abs(pcm[i]); if (e < min) { min = e; best = p + W / 2; } }
    out.push([s, best]); s = best;
  }
  out.push([s, pcm.length]); return out;
}
function wav(f) {
  const n = f.length, b = new ArrayBuffer(44 + n * 2), v = new DataView(b), w = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const x = Math.max(-1, Math.min(1, f[i])); v.setInt16(44 + i * 2, x < 0 ? x * 32768 : x * 32767, true); }
  return new Blob([b], { type: "audio/wav" });
}

/* ---------- server call ---------- */
async function send(blob) {
  const q = new URLSearchParams({ model: val("mdl"), lang: val("lang") });
  for (let a = 0; a < 3; a++) {
    let r; try { r = await fetch("/api/transcribe?" + q, { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: blob }); }
    catch (e) { throw new Error("No internet connection. Please try again."); }
    let j = {}; try { j = await r.json(); } catch (e) { }
    if (r.ok) return j;
    if (r.status === 429 && a < 2) { step(2, "Server is busy. Retrying in a few seconds…"); await sleep(9000 * (a + 1)); continue; }
    if (r.status === 404) throw new Error("The transcription service was not found. Make sure the api folder is uploaded to GitHub, then redeploy.");
    throw new Error(j.error || "Something went wrong (" + r.status + ").");
  }
}

/* ---------- main flow ---------- */
async function run(file) {
  if (running) return; running = true;
  $("err0").classList.add("hide"); $("err1").classList.add("hide"); $("retry").classList.add("hide");
  show("work"); step(1, "Preparing your file…", null);
  try {
    $("pl").src = URL.createObjectURL(file);
    const pcm = await getPcm(file);
    const parts = split(pcm); lines = []; words = [];
    for (let i = 0; i < parts.length; i++) {
      step(2, "Transcribing" + (parts.length > 1 ? " part " + (i + 1) + " of " + parts.length : "") + "…", parts.length > 1 ? (i / parts.length) * 100 : null);
      const [a, b] = parts[i], off = a / 16000;
      const j = await send(wav(pcm.subarray(a, b)));
      (j.segments || []).forEach(s => s.text && lines.push({ s: s.start + off, e: s.end + off, t: s.text }));
      (j.words || []).forEach(w => words.push({ w: w.word.trim(), s: w.start + off, e: w.end + off }));
    }
    if (!lines.length) throw new Error("No speech was found. Check that the file has a clear voice.");
    step(3, "Done", 100); await sleep(350);
    render(); show("out"); running = false;
  } catch (e) {
    fail(e.message === "silent" ? "No sound was found in this file. It may not have an audio track."
      : e.message === "unsupported" ? "This file type cannot be read here. Try an MP3, M4A, WAV or MP4 file."
      : e.message || "Something went wrong. Please try again.");
  }
}

/* ---------- result ---------- */
function render() {
  const t = val("mode") === "time";
  $("list").innerHTML = t
    ? lines.map(l => `<div class="ln" data-s="${l.s}"><span class="t">${fmt(l.s)}</span><span>${esc(l.t)}</span></div>`).join("")
    : `<div class="plain">${esc(lines.map(l => l.t).join(" "))}</div>`;
  $("note").textContent = t ? "Tap a line to play from there. Copy includes the start time of every word." : "";
  $("dl").textContent = t ? "Download SRT" : "Download TXT";
}
document.querySelectorAll("input[name=mode]").forEach(r => r.onchange = render);
$("list").addEventListener("click", e => { const n = e.target.closest("[data-s]"); if (n) { $("pl").currentTime = +n.dataset.s; $("pl").play(); } });
$("pl").addEventListener("timeupdate", () => {
  const t = $("pl").currentTime, i = lines.findIndex(l => t >= l.s && t < l.e);
  document.querySelectorAll("#list .ln").forEach((el, k) => el.classList.toggle("cur", k === i));
});
function outText() {
  if (val("mode") === "text") return lines.map(l => l.t).join(" ");
  const total = words.length ? words[words.length - 1].e : lines[lines.length - 1].e;
  return "VOICE-OVER TRANSCRIPT WITH TIMING (seconds, total ≈ " + total.toFixed(2) + "s)\n\n[LINES]\n"
    + lines.map(l => `[${l.s.toFixed(2)} → ${l.e.toFixed(2)}] ${l.t}`).join("\n")
    + "\n\n[WORDS: start time of each word]\n" + words.map(x => `${x.w}(${x.s.toFixed(2)})`).join(" ");
}
function download(name, data) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "text/plain" })); a.download = name; a.click(); }
$("dl").onclick = () => val("mode") === "text" ? download("transcript.txt", outText())
  : download("transcript.srt", lines.map((l, i) => `${i + 1}\n${srtT(l.s)} --> ${srtT(l.e)}\n${l.t}\n`).join("\n"));
$("cp").onclick = async () => {
  const b = $("cp");
  try { await navigator.clipboard.writeText(outText()); b.textContent = "Copied ✓"; }
  catch (e) { download("transcript.txt", outText()); b.textContent = "Saved ✓"; }
  setTimeout(() => b.textContent = "Copy", 1800);
};
</script>
</body>
</html>
